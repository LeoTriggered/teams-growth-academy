<!--
  KAJABI: 3 cards under the For Students hero. Custom Code (not Text). Width = 12 columns.
  Paste ALL of this including <style>.
  Desktop = 3 cards in a row. Phone = 1 card stacked, no overlap.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
.tga-pills,.tga-pills *,.tga-pills *::before,.tga-pills *::after{box-sizing:border-box!important;}
.tga-pills{width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding:8px 16px 40px!important;background:#F9FAFB!important;font-family:Archivo,'Open Sans',Arial,sans-serif!important;color:#13151A!important;overflow-x:hidden!important;}
.tga-pills__in{width:100%!important;max-width:1200px!important;min-width:0!important;margin:0 auto!important;display:flex!important;flex-direction:column!important;gap:16px!important;}
.tga-pills__card{width:100%!important;min-width:0!important;margin:0!important;padding:28px 24px!important;background:#ffffff!important;border:1px solid #e5e7eb!important;border-radius:24px!important;box-shadow:0 1px 2px rgba(19,21,26,.05)!important;}
.tga-pills__icon{width:48px!important;height:48px!important;border-radius:16px!important;display:flex!important;align-items:center!important;justify-content:center!important;margin:0 0 18px!important;}
.tga-pills__icon--mint{background:#E6F6F7!important;border:1px solid rgba(57,178,185,.20)!important;}
.tga-pills__icon--dark{background:#13151A!important;border:0!important;}
.tga-pills__icon svg{width:22px!important;height:22px!important;display:block!important;}
.tga-pills__icon--mint svg{fill:#1B878D!important;}
.tga-pills__icon--dark svg{fill:#ffffff!important;}
.tga-pills h2.tga-pills__title,
.tga-pills h2.tga-pills__title span{display:block!important;margin:0 0 8px!important;padding:0!important;color:#13151A!important;-webkit-text-fill-color:#13151A!important;font-size:20px!important;font-weight:700!important;line-height:1.3!important;text-align:left!important;}
.tga-pills p.tga-pills__text,
.tga-pills p.tga-pills__text span{display:block!important;margin:0!important;padding:0!important;color:#4A4A4A!important;-webkit-text-fill-color:#4A4A4A!important;font-size:16px!important;line-height:1.6!important;text-align:left!important;overflow-wrap:break-word!important;}
@media only screen and (max-width:1023px){
  .tga-pills__in{display:flex!important;flex-direction:column!important;}
  .tga-pills__card{width:100%!important;max-width:100%!important;float:none!important;clear:both!important;}
}
@media only screen and (min-width:768px){
  .tga-pills{padding:8px 24px 48px!important;}
}
@media only screen and (min-width:1024px){
  .tga-pills{padding:8px 24px 56px!important;}
  .tga-pills__in{display:flex!important;flex-direction:row!important;align-items:stretch!important;gap:20px!important;}
  .tga-pills__card{flex:1 1 33%!important;}
}
</style>
<div class="tga-pills">

      <span class="tga-pills__icon tga-pills__icon--mint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"></path></svg></span>
      <h2 class="tga-pills__title" style="color:#13151A!important;-webkit-text-fill-color:#13151A!important;"><span style="color:#13151A!important;">Know what's coming</span></h2>
      <p class="tga-pills__text" style="color:#4A4A4A!important;-webkit-text-fill-color:#4A4A4A!important;"><span style="color:#4A4A4A!important;">What 7th grade, 9th grade, and after graduation actually feel like</span></p>
    </div>
    <div class="tga-pills__card">
      <span class="tga-pills__icon tga-pills__icon--dark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"></path></svg></span>
      <h2 class="tga-pills__title" style="color:#13151A!important;-webkit-text-fill-color:#13151A!important;"><span style="color:#13151A!important;">Speak up for yourself</span></h2>
      <p class="tga-pills__text" style="color:#4A4A4A!important;-webkit-text-fill-color:#4A4A4A!important;"><span style="color:#4A4A4A!important;">How to say what you mean when the room is loud</span></p>
    </div>
    <div class="tga-pills__card">
      <span class="tga-pills__icon tga-pills__icon--mint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"></path></svg></span>
      <h2 class="tga-pills__title" style="color:#13151A!important;-webkit-text-fill-color:#13151A!important;"><span style="color:#13151A!important;">Use it the same day</span></h2>
      <p class="tga-pills__text" style="color:#4A4A4A!important;-webkit-text-fill-color:#4A4A4A!important;"><span style="color:#4A4A4A!important;">Practice, then a plan. Not another talk you forget by lunch.</span></p>
    </div>
  </div>
</div>
