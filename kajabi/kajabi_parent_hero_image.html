<!-- =====================================================================
   KAJABI CUSTOM CODE — Parent hero image (right 6-column block)
   Polo photo only. Mint wash + shadow-2xl match the preview card.
   Expert Led and 26 Labs boxes removed.
   Paste this entire block over the existing Custom Code.
   ===================================================================== -->
<style>
.tga-hero-media{
  position:relative;
  width:100%;
  max-width:480px;
  margin:0 auto;
  padding:18px 16px 22px;
  box-sizing:border-box;
}
.tga-hero-media *,
.tga-hero-media *::before,
.tga-hero-media *::after{box-sizing:border-box;}

/* Same mint wash as the preview card */
.tga-hero-media__wash{
  position:absolute;
  inset:18px 16px 22px;
  background:rgba(57,178,185,.15);
  border-radius:24px;
  transform:rotate(2deg) scale(1.05);
  pointer-events:none;
  z-index:0;
}

.tga-hero-media__card{
  position:relative;
  z-index:1;
  overflow:hidden;
  border-radius:24px;
  aspect-ratio:4/5;
  background:#E6F6F7;
  border:1px solid #fff;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
}

.tga-hero-media__card img,
.tga-hero-media img.tga-hero-media_img{
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  object-fit:cover !important;
  object-position:center top !important;
  display:block !important;
  margin:0 !important;
  border:0 !important;
  border-radius:0 !important;
  box-shadow:none !important;
}

@media (max-width:640px){
  .tga-hero-media{max-width:420px;padding:14px 10px 18px;}
  .tga-hero-media__wash{inset:14px 10px 18px;}
}
</style>

<div class="tga-hero-media">
  <div class="tga-hero-media__wash" aria-hidden="true">&nbsp;</div>
  <div class="tga-hero-media__card">
    <img
      class="tga-hero-media_img"
      src="https://kajabi-storefronts-production.kajabi-cdn.com/kajabi-storefronts-production/file-uploads/sites/2148874776/images/86b72d8-22ee-6dee-d8bc-b47a583fa3a_IMG_3194.jpeg"
      alt="Coach Walker"
      width="600"
      height="750"
    />
  </div>
</div>
