name: Sync website copy

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tga-save]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull shared copy
        env:
          COPY_JSON: ${{ github.event.client_payload.json }}
        run: |
          python3 <<'PY'
          import json, os, pathlib, urllib.request
          path = pathlib.Path("tga-content.json")
          raw = os.environ.get("COPY_JSON") or ""
          data = None
          if raw.strip():
              data = json.loads(raw)
          else:
              url = "https://crudcrud.com/api/0019de36b53f4bbb86c17f903957ab2b/tga/6ad9c38a871dae03e85004b9"
              try:
                  with urllib.request.urlopen(url, timeout=30) as res:
                      data = json.loads(res.read().decode())
              except Exception as exc:
                  print("skip", exc)
                  raise SystemExit(0)
          if not isinstance(data, dict):
              raise SystemExit(0)
          data.pop("_id", None)
          if not data.get("updatedAt"):
              print("no updatedAt")
              raise SystemExit(0)
          current = {}
          if path.exists():
              current = json.loads(path.read_text())
          if current.get("updatedAt") and current["updatedAt"] >= data["updatedAt"] and not raw.strip():
              print("file is current")
              raise SystemExit(0)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          print("updated file")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tga-content.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Save website copy"
          git push
      - name: Update gist
        env:
          GH_TOKEN: ${{ secrets.COPY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "no gist token"
            exit 0
          fi
          gh gist edit 7fef17de4247b60c4892c88e071e9528 --filename tga-content.json tga-content.json
